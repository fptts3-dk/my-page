<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Race Engineer App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, setDoc, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- ENVIRONMENT & VARIABLE SAFETY ---
        // ReferenceError 방지를 위해 typeof 사용
        const isCanvasEnv = typeof __firebase_config !== 'undefined';
        const getSafeAppId = () => {
            if (typeof __app_id !== 'undefined') return __app_id;
            return 'race-engineer-local-v1';
        };
        const appId = getSafeAppId();

        // --- GLOBAL STATE ---
        let appState = {
            car: "CAR #001 TEST",
            date: "202X-XX-XX",
            dayTitles: { 1: "Day 1 Schedule", 2: "Day 2 Schedule" },
            days: {
                1: [
                    { id: '1700000001', name: "Session 1: 웜업", time: "09:00 - 09:30", purpose: "코스 숙지 및 차량 점검", detail: "초기 셋업 데이터를 수집합니다.", fuel: 20, tire: "연습용 (중고)", tireType: "used", note: "공기압 냉간 28psi 설정" }
                ],
                2: []
            },
            checklist: [
                { text: "브레이크 패드 잔량 확인", checked: false }
            ]
        };

        let user = null;
        let isSaving = false;
        let editingDay = 1;
        let db, auth;

        // --- INITIALIZATION ---
        async function initApp() {
            // 로컬 데이터 먼저 로드하여 즉시 표시
            loadLocalData();

            if (isCanvasEnv) {
                try {
                    const firebaseConfig = JSON.parse(__firebase_config);
                    const app = initializeApp(firebaseConfig);
                    auth = getAuth(app);
                    db = getFirestore(app);

                    onAuthStateChanged(auth, (u) => {
                        user = u;
                        if (user) {
                            startRealtimeSync();
                        } else {
                            authenticate();
                        }
                    });
                } catch (e) {
                    console.warn("Firebase Sync skipped: Running in standalone mode.");
                }
            }
        }

        async function authenticate() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth Error:", error);
            }
        }

        function loadLocalData() {
            const saved = localStorage.getItem('raceAppState');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    // 데이터 구조 보정 (구버전 데이터 호환성)
                    if (parsed && typeof parsed === 'object') {
                        appState = { ...appState, ...parsed };
                        if (!appState.days || Array.isArray(appState.days)) appState.days = parsed.days || {};
                    }
                } catch (e) { console.error("Local data parse error", e); }
            }
            renderAll();
        }

        // --- REALTIME SYNC (Canvas Only) ---
        function startRealtimeSync() {
            if (!db || !user) return;
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'plan_master', 'current');

            onSnapshot(docRef, (snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.data();
                    if (!isSaving) {
                        appState = {
                            ...appState,
                            ...data,
                            days: data.days || {},
                            dayTitles: data.dayTitles || {},
                            checklist: data.checklist || []
                        };
                        renderAll();
                        localStorage.setItem('raceAppState', JSON.stringify(appState));
                    }
                } else {
                    saveData();
                }
            }, (error) => {
                console.warn("Realtime sync unavailable in this environment.");
            });
        }

        window.saveData = async function() {
            isSaving = true;
            try {
                // 로컬 저장 (항상 수행)
                localStorage.setItem('raceAppState', JSON.stringify(appState));

                // 클라우드 저장 (Canvas 환경일 때만)
                if (isCanvasEnv && user && db) {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'plan_master', 'current');
                    await setDoc(docRef, appState);
                }
            } catch (error) {
                console.error("Save Error:", error);
            } finally {
                setTimeout(() => { isSaving = false; }, 1000);
            }
        }

        // --- UI RENDERING ---
        window.renderAll = () => {
            try {
                const header = document.getElementById('header-title');
                if (!header) return;

                // 데이터 무결성 체크
                if (!appState.days || typeof appState.days !== 'object') appState.days = {};
                if (!appState.dayTitles || typeof appState.dayTitles !== 'object') appState.dayTitles = {};
                if (!appState.checklist || !Array.isArray(appState.checklist)) appState.checklist = [];

                renderHeader();
                renderTimeline();
                renderChecklist();
            } catch (err) {
                console.error("Critical Render Error:", err);
            }
        };

        function renderHeader() {
            const el = document.getElementById('header-title');
            if (el) el.textContent = "Session Plan";
        }

        function renderTimeline() {
            const list = document.getElementById('timeline-container');
            if (!list) return;
            list.innerHTML = '';
            
            const activeDays = Object.keys(appState.days).map(Number).sort((a,b) => a-b);
            
            activeDays.forEach(day => {
                if (isNaN(day)) return;
                const sessions = appState.days[day] || [];
                const title = appState.dayTitles[day] || `Day ${day} Schedule`;
                
                let html = `
                <div class="mb-6 border border-slate-700/60 rounded-xl overflow-hidden bg-[#16181d] shadow-lg">
                    <div class="p-4 border-b border-slate-700/60 flex justify-between items-center bg-[#1c1e24]">
                        <div class="flex items-center gap-2">
                            <h2 class="text-base font-bold text-slate-100">${title}</h2>
                        </div>
                        <button onclick="openDayTitleEditor(${day})" class="text-[12px] text-slate-400 hover:text-white transition-colors p-1">⚙️</button>
                    </div>
                    <div class="flex flex-col">
                `;
                
                if (sessions.length === 0) {
                    html += `<div class="p-6 text-center text-[11px] text-slate-500">No sessions scheduled.</div>`;
                }

                sessions.forEach((s) => {
                    if (!s) return;
                    const timeStr = s.time || "00:00";
                    let startTime = timeStr, endTime = "";
                    if (timeStr.includes('-')) { [startTime, endTime] = timeStr.split('-').map(t => t.trim()); }
                    else if (timeStr.includes('~')) { [startTime, endTime] = timeStr.split('~').map(t => t.trim()); }
                    
                    const colors = { new: 'border-green-500', used: 'border-yellow-500', super: 'border-orange-500' };
                    const borderColor = colors[s.tireType] || 'border-blue-500';

                    html += `
                        <div class="flex flex-col border-b border-slate-800/60 last:border-none">
                            <div class="flex min-h-[4.5rem] group cursor-pointer hover:bg-white/[0.02] transition-colors" onclick="toggleSessionDetail('${s.id}')">
                                <div class="w-[4.5rem] flex flex-col items-center justify-center py-3 shrink-0">
                                    <span class="text-sm font-bold text-slate-200">${startTime}</span>
                                    ${endTime ? `<span class="text-[10px] text-slate-500 font-medium mt-0.5">~ ${endTime}</span>` : ''}
                                </div>
                                <div class="flex-1 py-3 pr-4 flex items-center">
                                    <div class="w-full bg-[#20232a] rounded-lg p-3 border-l-4 ${borderColor} flex justify-between items-center shadow-sm">
                                        <div class="flex-1 min-w-0 pr-3">
                                            <h4 class="text-sm font-bold text-slate-100 mb-0.5 truncate">${s.name}</h4>
                                            <p class="text-[11px] text-slate-400 font-medium truncate">${s.fuel}L • ${s.tire}</p>
                                        </div>
                                        <div class="text-slate-600 group-hover:text-slate-400 flex items-center justify-center">
                                            <svg id="icon-${s.id}" class="transition-transform duration-200" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M6 9l6 6 6-6"/></svg>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div id="detail-${s.id}" class="hidden flex">
                                <div class="w-[4.5rem] shrink-0"></div>
                                <div class="flex-1 pr-4 pb-4">
                                    <div class="bg-[#1c1e24] border border-slate-700/50 rounded-lg p-4 text-sm space-y-3 shadow-inner">
                                        <div><p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">목표/목적</p><p class="text-slate-200">${s.purpose || '-'}</p></div>
                                        <div><p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">상세 계획</p><p class="text-slate-300 text-[13px] leading-relaxed whitespace-pre-wrap">${s.detail || '-'}</p></div>
                                        ${s.note ? `<div><p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">기타</p><p class="text-slate-300 text-[13px] leading-relaxed whitespace-pre-wrap">${s.note}</p></div>` : ''}
                                        <div class="pt-3 border-t border-slate-700/50 flex justify-end">
                                            <button onclick="openEditor('${s.id}', ${day})" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-[11px] font-bold rounded-lg shadow transition-colors flex items-center gap-1.5">수정하기</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                html += `
                    <div class="flex min-h-[3.2rem] group cursor-pointer hover:bg-white/[0.02] transition-colors" onclick="addNewSession(${day})">
                        <div class="w-[4.5rem] flex items-center justify-center py-2 shrink-0"><span class="text-slate-600 text-lg font-light">+</span></div>
                        <div class="flex-1 py-2 pr-4 flex items-center">
                            <div class="w-full bg-[#1c1e24] rounded-lg p-2 border border-dashed border-slate-700/50 flex justify-between items-center shadow-sm">
                                <div class="flex-1 min-w-0 pr-3"><h4 class="text-xs font-bold text-slate-500">세션 추가</h4></div>
                                <div class="text-slate-700 group-hover:text-slate-500 flex items-center justify-center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M6 9l6 6 6-6"/></svg></div>
                            </div>
                        </div>
                    </div>
                `;
                
                html += `</div></div>`;
                list.insertAdjacentHTML('beforeend', html);
            });

            list.insertAdjacentHTML('beforeend', `
                <button onclick="addDay()" class="w-full mb-6 py-4 border-2 border-dashed border-slate-700/60 rounded-xl text-slate-500 font-bold hover:text-slate-300 hover:border-slate-500 hover:bg-white/[0.02] transition-colors flex items-center justify-center gap-2">
                    <span class="text-xl leading-none mb-0.5">+</span> Add Day
                </button>
            `);
        }

        function renderChecklist() {
            const ui = document.getElementById('checklist-ui');
            if (!ui) return;
            const checked = appState.checklist.filter(i => i && i.checked).length;
            const total = appState.checklist.length;
            const perc = total === 0 ? 0 : Math.round((checked/total)*100);
            
            let html = `
            <div class="mb-8 border border-slate-700/60 rounded-xl overflow-hidden bg-[#16181d] shadow-lg">
                <div class="p-4 border-b border-slate-700/60 bg-[#1c1e24]">
                    <div class="flex justify-between items-center mb-3">
                        <h2 class="text-base font-bold text-slate-100">Checklist</h2>
                        <span class="text-xs font-bold ${perc === 100 ? 'text-green-400' : 'text-indigo-400'}">${perc}%</span>
                    </div>
                    <div class="w-full bg-slate-800 rounded-full h-1.5 overflow-hidden">
                        <div class="${perc === 100 ? 'bg-green-500' : 'bg-indigo-500'} h-1.5 rounded-full transition-all duration-500" style="width: ${perc}%"></div>
                    </div>
                </div>
                <div class="flex flex-col p-2">
            `;

            appState.checklist.forEach((item, i) => {
                if (!item) return;
                html += `
                    <div class="flex items-center justify-between py-1.5 px-3 border-b border-slate-800/60 last:border-none group">
                        <div class="flex items-center gap-3 cursor-pointer flex-1" onclick="toggleCheck(${i})">
                            <div class="w-5 h-5 rounded-md border-2 flex items-center justify-center transition-all ${item.checked ? 'bg-indigo-500 border-indigo-500' : 'border-slate-500 bg-slate-800/50'}">
                                ${item.checked ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>' : ''}
                            </div>
                            <span class="text-sm font-medium transition-colors ${item.checked ? 'text-slate-500 line-through' : 'text-slate-300'}">${item.text}</span>
                        </div>
                        <button onclick="deleteCheck(${i})" class="text-slate-600 hover:text-red-400 px-2 py-1">✕</button>
                    </div>
                `;
            });

            html += `
                    <div class="flex items-center gap-3 py-1.5 px-3">
                        <span class="text-slate-500 text-lg leading-none">+</span>
                        <input type="text" placeholder="Add task..." onkeydown="if(event.key==='Enter') addCheck(this)" class="bg-transparent border-none text-sm text-slate-300 placeholder:text-slate-600 focus:outline-none w-full">
                    </div>
                </div>
            </div>
            `;
            ui.innerHTML = html;
        }

        // --- HANDLERS ---
        window.toggleSessionDetail = (id) => {
            const detailEl = document.getElementById(`detail-${id}`);
            const iconEl = document.getElementById(`icon-${id}`);
            if (detailEl.classList.contains('hidden')) {
                detailEl.classList.remove('hidden');
                if (iconEl) iconEl.style.transform = 'rotate(180deg)';
            } else {
                detailEl.classList.add('hidden');
                if (iconEl) iconEl.style.transform = 'rotate(0deg)';
            }
        };

        window.toggleCheck = (i) => { appState.checklist[i].checked = !appState.checklist[i].checked; renderChecklist(); saveData(); };
        window.addCheck = (input) => { if (!input.value.trim()) return; appState.checklist.push({ text: input.value, checked: false }); input.value = ''; renderChecklist(); saveData(); };
        window.deleteCheck = (i) => { appState.checklist.splice(i, 1); renderChecklist(); saveData(); };

        window.addDay = () => {
            const activeDays = Object.keys(appState.days).map(Number).filter(n => !isNaN(n));
            const newDay = activeDays.length > 0 ? Math.max(...activeDays) + 1 : 1;
            appState.days[newDay] = [];
            appState.dayTitles[newDay] = `Day ${newDay} Schedule`;
            renderAll(); saveData();
        };

        window.deleteDay = () => {
            const day = document.getElementById('editing-day-id').value;
            delete appState.days[day];
            delete appState.dayTitles[day];
            closeDayTitleModal(); renderAll(); saveData();
        };

        window.openDayTitleEditor = (day) => {
            document.getElementById('editing-day-id').value = day;
            document.getElementById('in-day-title').value = appState.dayTitles[day] || `Day ${day} Schedule`;
            document.getElementById('day-title-modal').classList.remove('hidden');
        };

        window.saveDayTitle = () => {
            const day = document.getElementById('editing-day-id').value;
            appState.dayTitles[day] = document.getElementById('in-day-title').value;
            closeDayTitleModal(); renderAll(); saveData();
        };

        window.closeDayTitleModal = () => document.getElementById('day-title-modal').classList.add('hidden');

        window.saveSession = () => {
            const id = document.getElementById('edit-id').value;
            const data = {
                id: id || Date.now().toString(),
                name: document.getElementById('in-name').value || "New Session",
                time: document.getElementById('in-time').value || "00:00 - 00:00",
                fuel: parseInt(document.getElementById('in-fuel').value) || 0,
                purpose: document.getElementById('in-purpose').value,
                detail: document.getElementById('in-detail').value,
                tireType: document.getElementById('in-tire-type').value,
                tire: document.getElementById('in-tire').value,
                note: document.getElementById('in-note').value
            };
            
            if (!appState.days[editingDay]) appState.days[editingDay] = [];
            if (id) {
                const idx = appState.days[editingDay].findIndex(x => x.id === id);
                if (idx !== -1) appState.days[editingDay][idx] = data;
            } else {
                appState.days[editingDay].push(data);
            }
            closeModal(); renderAll(); saveData();
        };

        window.deleteSessionFromModal = () => {
            const id = document.getElementById('edit-id').value;
            if (appState.days[editingDay]) {
                appState.days[editingDay] = appState.days[editingDay].filter(x => x.id !== id);
            }
            closeModal(); renderAll(); saveData();
        };

        window.openEditor = (id, day) => {
            editingDay = day;
            const s = appState.days[day].find(x => x.id === id);
            if (!s) return;
            document.getElementById('edit-id').value = id;
            document.getElementById('in-name').value = s.name;
            document.getElementById('in-time').value = s.time;
            document.getElementById('in-fuel').value = s.fuel;
            document.getElementById('in-purpose').value = s.purpose;
            document.getElementById('in-detail').value = s.detail;
            document.getElementById('in-tire-type').value = s.tireType;
            document.getElementById('in-tire').value = s.tire;
            document.getElementById('in-note').value = s.note || "";
            document.getElementById('modal').classList.remove('hidden');
        };

        window.addNewSession = (day) => {
            editingDay = day;
            document.getElementById('session-form').reset();
            document.getElementById('edit-id').value = "";
            document.getElementById('modal').classList.remove('hidden');
        };

        window.closeModal = () => document.getElementById('modal').classList.add('hidden');

        // 초기 실행
        document.addEventListener('DOMContentLoaded', () => {
            initApp();
        });
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0b0c10; color: #e2e8f0; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        input, select, textarea { background-color: #1e2128 !important; color: #f1f5f9 !important; border: 1px solid #334155 !important; }
        input:focus, select:focus, textarea:focus { outline: none !important; border-color: #6366f1 !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center">
    <div class="w-full max-w-[480px] min-h-screen flex flex-col bg-[#0b0c10] relative shadow-2xl">
        <header class="sticky top-0 z-40 bg-[#0b0c10]/90 backdrop-blur-md px-4 pt-4 pb-2 flex items-center justify-center">
            <h1 id="header-title" class="text-base font-bold text-slate-100 tracking-wide text-center">Session Plan</h1>
        </header>
        <main class="flex-grow w-full px-4 pt-2 pb-6 overflow-x-hidden">
            <div id="timeline-container" class="w-full"></div>
            <div id="checklist-ui" class="w-full mt-4"></div>
            <div class="h-10"></div>
        </main>

        <!-- Session Editor Modal -->
        <div id="modal" class="fixed inset-0 z-50 hidden flex flex-col items-center justify-end sm:justify-center p-0 sm:p-4">
            <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeModal()"></div>
            <div class="w-full max-w-[480px] bg-[#16181d] rounded-t-3xl sm:rounded-3xl shadow-2xl z-10 flex flex-col max-h-[90vh] sm:max-h-[85vh] border border-slate-700/50">
                <div class="p-5 border-b border-slate-800 flex justify-between items-center shrink-0">
                    <h3 class="text-lg font-bold text-white">Edit Session</h3>
                    <button type="button" onclick="closeModal()" class="w-8 h-8 bg-slate-800 rounded-full flex items-center justify-center text-slate-300">✕</button>
                </div>
                <form id="session-form" class="p-5 space-y-4 overflow-y-auto" onsubmit="event.preventDefault(); saveSession();">
                    <input type="hidden" id="edit-id">
                    <div class="space-y-4">
                        <div><label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5 block">Session Title</label><input type="text" id="in-name" class="w-full rounded-xl p-3.5 text-sm font-semibold"></div>
                        <div class="grid grid-cols-2 gap-4">
                            <div><label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5 block">Time Slot</label><input type="text" id="in-time" class="w-full rounded-xl p-3.5 text-sm font-mono" placeholder="09:00 - 09:30"></div>
                            <div><label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5 block">Fuel (L)</label><input type="number" id="in-fuel" class="w-full rounded-xl p-3.5 text-sm font-mono"></div>
                        </div>
                        <div><label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5 block">목표/목적</label><input type="text" id="in-purpose" class="w-full rounded-xl p-3.5 text-sm"></div>
                        <div><label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5 block">상세 계획</label><textarea id="in-detail" class="w-full rounded-xl p-3.5 text-sm h-24 resize-none"></textarea></div>
                        <div class="grid grid-cols-2 gap-4">
                            <div><label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5 block">Tire Tag</label>
                                <select id="in-tire-type" class="w-full rounded-xl p-3.5 text-sm font-medium">
                                    <option value="new">신품 (New)</option><option value="used">중고 (Used)</option><option value="super">결승용 (Super)</option>
                                </select>
                            </div>
                            <div><label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5 block">Tire Detail</label><input type="text" id="in-tire" class="w-full rounded-xl p-3.5 text-sm" placeholder="예: 신품 2개"></div>
                        </div>
                        <div><label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5 block">기타</label><input type="text" id="in-note" class="w-full rounded-xl p-3.5 text-sm"></div>
                    </div>
                </form>
                <div class="p-5 border-t border-slate-800 flex gap-3 bg-[#16181d] rounded-b-3xl">
                    <button type="button" onclick="deleteSessionFromModal()" class="px-5 py-3.5 bg-red-500/10 text-red-500 rounded-xl text-sm font-bold hover:bg-red-500/20 transition-all">Delete</button>
                    <button type="button" onclick="saveSession()" class="flex-1 py-3.5 bg-indigo-600 text-white rounded-xl text-sm font-bold shadow-lg hover:bg-indigo-500 transition-all">Save Changes</button>
                </div>
            </div>
        </div>

        <!-- Day Title Edit Modal -->
        <div id="day-title-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">
            <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeDayTitleModal()"></div>
            <div class="bg-[#16181d] max-w-sm w-full rounded-3xl p-6 shadow-2xl z-10 border border-slate-700/50">
                <input type="hidden" id="editing-day-id">
                <div class="flex justify-between items-center mb-5"><h3 class="font-bold text-white text-lg">일정 제목 수정</h3><button onclick="closeDayTitleModal()" class="text-slate-400">✕</button></div>
                <div class="space-y-4">
                    <div><label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5">제목 (Title)</label><input type="text" id="in-day-title" class="w-full rounded-xl p-3.5 text-sm"></div>
                </div>
                <div class="flex gap-3 mt-6">
                    <button type="button" onclick="deleteDay()" class="px-5 bg-red-500/10 text-red-500 py-3.5 rounded-xl text-sm font-bold hover:bg-red-500/20">Delete Day</button>
                    <button type="button" onclick="saveDayTitle()" class="flex-1 bg-slate-100 text-slate-900 py-3.5 rounded-xl text-sm font-bold">Apply</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
