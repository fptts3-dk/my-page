<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Race Engineer App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // --- GLOBAL STATE ---
        let appState = {
            car: "CAR #001 TEST",
            date: "202X-XX-XX",
            days: {
                1: [
                    { id: '1700000001', name: "Session 1: 웜업", time: "09:00 - 09:30", purpose: "코스 숙지 및 차량 점검", detail: "초기 셋업 데이터를 수집합니다.", fuel: 20, tire: "연습용 (중고)", tireType: "used", note: "공기압 냉간 28psi 설정" },
                    { id: '1700000002', name: "Session 2: 어택", time: "11:00 - 11:30", purpose: "랩타임 단축", detail: "최대 퍼포먼스 주행", fuel: 15, tire: "신품 (A급)", tireType: "new", note: "캠버 점검" }
                ],
                2: [
                    { id: '1700000003', name: "롱런 테스트", time: "14:00 - 14:40", purpose: "레이스 시뮬레이션", detail: "연속 주행 테스트", fuel: 40, tire: "결승용", tireType: "super", note: "온도 모니터링" }
                ]
            },
            checklist: [
                { text: "브레이크 패드 잔량 확인", checked: true },
                { text: "엔진 오일 체크", checked: false },
                { text: "데이터 로거 작동 확인", checked: false }
            ]
        };

        let editingDay = 1;

        // --- DATA LOADING & SAVING (Local Storage) ---
        function loadData() {
            const savedData = localStorage.getItem('raceAppState');
            if (savedData) {
                try {
                    appState = JSON.parse(savedData);
                } catch (e) { console.error("Local data parse error", e); }
            }
            renderAll();
        }

        window.saveData = function() {
            localStorage.setItem('raceAppState', JSON.stringify(appState));
            
            // Show save indicator
            const saveBtn = document.getElementById('btn-save');
            const origText = saveBtn.innerText;
            saveBtn.innerText = "Saved";
            saveBtn.classList.add('text-green-400');
            setTimeout(() => {
                saveBtn.innerText = origText;
                saveBtn.classList.remove('text-green-400');
            }, 1500);
        }

        // --- UI & LOGIC ---
        window.renderAll = () => {
            // 방어 코드: 데이터가 비어있어 발생하는 화면 멈춤 현상 방지
            if (!appState) appState = {};
            if (!appState.days) appState.days = { 1: [], 2: [] };
            if (!appState.checklist) appState.checklist = [];

            renderHeader();
            renderTimeline();
            renderChecklist();
        };

        function renderHeader() {
            document.getElementById('header-title').textContent = "Session Plan";
        }

        function renderTimeline() {
            const list = document.getElementById('timeline-container');
            list.innerHTML = '';
            
            [1, 2].forEach(day => {
                const sessions = appState.days[day] || [];
                
                let html = `
                <div class="mb-6 border border-slate-700/60 rounded-xl overflow-hidden bg-[#16181d] shadow-lg">
                    <!-- Section Header -->
                    <div class="p-4 border-b border-slate-700/60 flex justify-between items-center bg-[#1c1e24]">
                        <div class="flex items-center gap-2">
                            <h2 class="text-base font-bold text-slate-100">Day ${day} Schedule</h2>
                        </div>
                        <button onclick="openConfig()" class="text-[10px] text-slate-400 border border-slate-700 rounded px-2 py-1 hover:bg-slate-700 transition-colors flex items-center gap-1">
                            <span class="text-xs">⚙️</span> Config
                        </button>
                    </div>
                    
                    <!-- Sessions List -->
                    <div class="flex flex-col">
                `;
                
                if (sessions.length === 0) {
                    html += `<div class="p-6 text-center text-[11px] text-slate-500">No sessions scheduled.</div>`;
                }

                sessions.forEach((s, index) => {
                    const timeStr = s.time || "00:00";
                    let startTime = timeStr;
                    let endTime = "";
                    if (timeStr.includes('-')) {
                        const parts = timeStr.split('-');
                        startTime = parts[0].trim();
                        endTime = parts[1] ? parts[1].trim() : "";
                    } else if (timeStr.includes('~')) {
                        const parts = timeStr.split('~');
                        startTime = parts[0].trim();
                        endTime = parts[1] ? parts[1].trim() : "";
                    }
                    
                    // Border colors mapping to image style
                    const tireType = s.tireType || 'used';
                    const colors = { 
                        new: 'border-green-500', 
                        used: 'border-yellow-500', 
                        super: 'border-orange-500', 
                        worn: 'border-slate-500' 
                    };
                    const borderColor = colors[tireType] || 'border-blue-500';

                    html += `
                        <div class="flex flex-col border-b border-slate-800/60 last:border-none">
                            <div class="flex min-h-[4.5rem] group cursor-pointer hover:bg-white/[0.02] transition-colors" onclick="toggleSessionDetail('${s.id}')">
                                <div class="w-[4.5rem] flex flex-col items-center justify-center py-3 shrink-0">
                                    <span class="text-sm font-bold text-slate-200">${startTime}</span>
                                    ${endTime ? `<span class="text-[10px] text-slate-500 font-medium mt-0.5">~ ${endTime}</span>` : ''}
                                </div>
                                <div class="flex-1 py-3 pr-4 flex items-center">
                                    <div class="w-full bg-[#20232a] rounded-lg p-3 border-l-4 ${borderColor} flex justify-between items-center shadow-sm">
                                        <div class="flex-1 min-w-0 pr-3">
                                            <h4 class="text-sm font-bold text-slate-100 mb-0.5 truncate">${s.name}</h4>
                                            <p class="text-[11px] text-slate-400 font-medium truncate">${s.fuel}L • ${s.tire}</p>
                                        </div>
                                        <div class="text-slate-600 group-hover:text-slate-400 flex items-center justify-center">
                                            <svg id="icon-${s.id}" class="transition-transform duration-200" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Detailed View (Hidden by Default) -->
                            <div id="detail-${s.id}" class="hidden flex">
                                <div class="w-[4.5rem] shrink-0"></div>
                                <div class="flex-1 pr-4 pb-4">
                                    <div class="bg-[#1c1e24] border border-slate-700/50 rounded-lg p-4 text-sm space-y-3 shadow-inner">
                                        <div>
                                            <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">목표/목적</p>
                                            <p class="text-slate-200">${s.purpose || '-'}</p>
                                        </div>
                                        <div>
                                            <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">상세 계획</p>
                                            <p class="text-slate-300 text-[13px] leading-relaxed whitespace-pre-wrap">${s.detail || '-'}</p>
                                        </div>
                                        ${s.note ? `
                                        <div>
                                            <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">기타</p>
                                            <p class="text-slate-300 text-[13px] leading-relaxed whitespace-pre-wrap">${s.note}</p>
                                        </div>` : ''}
                                        <div class="pt-3 border-t border-slate-700/50 flex justify-end">
                                            <button onclick="openEditor('${s.id}', ${day})" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-[11px] font-bold rounded-lg shadow transition-colors flex items-center gap-1.5">
                                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                                                수정하기
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                // Add Button Row
                html += `
                        <div class="flex min-h-[4rem] group cursor-pointer hover:bg-white/[0.02] transition-colors" onclick="addNewSession(${day})">
                            <div class="w-16 flex flex-col items-center justify-center py-3 shrink-0"></div>
                            <div class="flex-1 py-3 pr-4 flex items-center border-t border-slate-800/60 mt-[-1px]">
                                <div class="w-full text-sm font-medium text-slate-400 flex items-center gap-2">
                                    <span class="text-lg font-light leading-none mb-0.5">+</span> Add
                                </div>
                            </div>
                        </div>
                `;
                
                html += `</div></div>`;
                list.insertAdjacentHTML('beforeend', html);
            });
        }

        function renderChecklist() {
            const ui = document.getElementById('checklist-ui');
            ui.innerHTML = '';
            
            let html = `
            <div class="mb-8 border border-slate-700/60 rounded-xl overflow-hidden bg-[#16181d] shadow-lg">
                <div class="p-4 border-b border-slate-700/60 bg-[#1c1e24]">
                    <h2 class="text-base font-bold text-slate-100">Maintenance</h2>
                </div>
                <div class="flex flex-col p-2">
            `;

            appState.checklist.forEach((item, i) => {
                html += `
                    <div class="flex items-center justify-between p-3 border-b border-slate-800/60 last:border-none group">
                        <div class="flex items-center gap-3 cursor-pointer flex-1" onclick="toggleCheck(${i})">
                            <div class="w-5 h-5 rounded-md border-2 flex items-center justify-center transition-all ${item.checked ? 'bg-indigo-500 border-indigo-500' : 'border-slate-500 bg-slate-800/50'}">
                                ${item.checked ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>' : ''}
                            </div>
                            <span class="text-sm font-medium transition-colors ${item.checked ? 'text-slate-500 line-through' : 'text-slate-300'}">${item.text}</span>
                        </div>
                        <button onclick="deleteCheck(${i})" class="text-slate-600 hover:text-red-400 p-2">✕</button>
                    </div>
                `;
            });

            html += `
                    <div class="flex items-center gap-3 p-3">
                        <span class="text-slate-500 text-lg leading-none">+</span>
                        <input type="text" placeholder="Add task..." onkeydown="if(event.key==='Enter') addCheck(this)" class="bg-transparent border-none text-sm text-slate-300 placeholder:text-slate-600 focus:outline-none w-full">
                    </div>
                </div>
            </div>
            `;
            
            ui.innerHTML = html;
        }

        // --- HANDLERS ---
        window.toggleSessionDetail = (id) => {
            const detailEl = document.getElementById(`detail-${id}`);
            const iconEl = document.getElementById(`icon-${id}`);
            if (detailEl.classList.contains('hidden')) {
                detailEl.classList.remove('hidden');
                if (iconEl) iconEl.style.transform = 'rotate(180deg)';
            } else {
                detailEl.classList.add('hidden');
                if (iconEl) iconEl.style.transform = 'rotate(0deg)';
            }
        };

        window.toggleCheck = (i) => { appState.checklist[i].checked = !appState.checklist[i].checked; renderChecklist(); saveData(); };
        window.addCheck = (input) => { if (!input.value.trim()) return; appState.checklist.push({ text: input.value, checked: false }); input.value = ''; renderChecklist(); saveData(); };
        window.deleteCheck = (i) => { appState.checklist.splice(i, 1); renderChecklist(); saveData(); };

        window.saveSession = () => {
            const id = document.getElementById('edit-id').value;
            const data = {
                id: id || Date.now().toString(),
                name: document.getElementById('in-name').value || "New Session",
                time: document.getElementById('in-time').value || "00:00 - 00:00",
                fuel: parseInt(document.getElementById('in-fuel').value) || 0,
                purpose: document.getElementById('in-purpose').value,
                detail: document.getElementById('in-detail').value,
                tireType: document.getElementById('in-tire-type').value,
                tire: document.getElementById('in-tire').value,
                note: document.getElementById('in-note').value
            };
            
            if (!appState.days[editingDay]) appState.days[editingDay] = [];
            const dayList = appState.days[editingDay];
            
            if (id) { 
                const idx = dayList.findIndex(x => x.id === id); 
                dayList[idx] = data; 
            } else { 
                dayList.push(data); 
            }
            
            closeModal(); renderAll(); saveData();
        };

        window.deleteSessionFromModal = () => {
            const id = document.getElementById('edit-id').value;
            if(appState.days[editingDay]) {
                appState.days[editingDay] = appState.days[editingDay].filter(x => x.id !== id);
            }
            closeModal(); renderAll(); saveData();
        };

        window.saveConfig = () => {
            appState.car = document.getElementById('cfg-car').value;
            appState.date = document.getElementById('cfg-date').value;
            document.getElementById('config-modal').classList.add('hidden');
            saveData();
        };

        window.openEditor = (id, day) => {
            editingDay = day;
            const s = appState.days[day].find(x => x.id === id);
            if (!s) return;
            document.getElementById('edit-id').value = id;
            document.getElementById('in-name').value = s.name;
            document.getElementById('in-time').value = s.time;
            document.getElementById('in-fuel').value = s.fuel;
            document.getElementById('in-purpose').value = s.purpose;
            document.getElementById('in-detail').value = s.detail;
            document.getElementById('in-tire-type').value = s.tireType;
            document.getElementById('in-tire').value = s.tire;
            document.getElementById('in-note').value = s.note;
            document.getElementById('modal').classList.remove('hidden');
        };

        window.addNewSession = (day) => { 
            editingDay = day;
            document.getElementById('session-form').reset(); 
            document.getElementById('edit-id').value = ""; 
            document.getElementById('modal').classList.remove('hidden'); 
        };
        
        window.closeModal = () => document.getElementById('modal').classList.add('hidden');
        
        window.openConfig = () => {
            document.getElementById('cfg-car').value = appState.car || "";
            document.getElementById('cfg-date').value = appState.date || "";
            document.getElementById('config-modal').classList.remove('hidden');
        };

        // Initialize App (화면(DOM) 로딩이 완료된 후 실행)
        document.addEventListener('DOMContentLoaded', loadData);
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0b0c10; color: #e2e8f0; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        
        /* Form Inputs Dark Mode */
        input, select, textarea { 
            background-color: #1e2128 !important; 
            color: #f1f5f9 !important;
            border: 1px solid #334155 !important;
        }
        input:focus, select:focus, textarea:focus {
            outline: none !important;
            border-color: #6366f1 !important;
            box-shadow: 0 0 0 1px #6366f1 !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center">

    <!-- Mobile App Container constraint -->
    <div class="w-full max-w-[480px] min-h-screen flex flex-col bg-[#0b0c10] relative shadow-2xl">
        
        <!-- App Header (Fixed) -->
        <header class="sticky top-0 z-40 bg-[#0b0c10]/90 backdrop-blur-md border-b border-slate-800/80 px-4 py-4 flex items-center justify-between">
            <button class="w-8 h-8 flex items-center justify-center text-slate-300 hover:text-white transition-colors">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <h1 id="header-title" class="text-base font-bold text-slate-100 tracking-wide">Session Plan</h1>
            <button id="btn-save" onclick="saveData()" class="text-sm font-semibold text-slate-400 hover:text-white transition-colors px-2">
                Save
            </button>
        </header>

        <!-- Main Scrollable Content -->
        <main class="flex-grow w-full px-4 py-6 overflow-x-hidden">
            <!-- Timeline Modules -->
            <div id="timeline-container" class="w-full"></div>
            
            <!-- Checklist Module -->
            <div id="checklist-ui" class="w-full mt-4"></div>
            
            <!-- Bottom spacer -->
            <div class="h-10"></div>
        </main>

        <!-- Editor Modal -->
        <div id="modal" class="fixed inset-0 z-50 hidden flex flex-col items-center justify-end sm:justify-center p-0 sm:p-4">
            <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeModal()"></div>
            
            <div class="w-full max-w-[480px] bg-[#16181d] rounded-t-3xl sm:rounded-3xl shadow-2xl z-10 flex flex-col max-h-[90vh] sm:max-h-[85vh] border border-slate-700/50 transform transition-transform">
                
                <!-- Modal Header -->
                <div class="p-5 border-b border-slate-800 flex justify-between items-center shrink-0">
                    <h3 class="text-lg font-bold text-white">Edit Session</h3>
                    <button onclick="closeModal()" class="w-8 h-8 bg-slate-800 rounded-full flex items-center justify-center text-slate-300">✕</button>
                </div>
                
                <!-- Modal Form -->
                <form id="session-form" class="p-5 space-y-4 overflow-y-auto">
                    <input type="hidden" id="edit-id">
                    
                    <div class="space-y-4">
                        <div>
                            <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5 block">Session Title</label>
                            <input type="text" id="in-name" class="w-full rounded-xl p-3.5 text-sm font-semibold" placeholder="e.g. Session 1">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5 block">Time Slot</label>
                                <input type="text" id="in-time" class="w-full rounded-xl p-3.5 text-sm font-mono" placeholder="09:00 - 09:30">
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5 block">Fuel (L)</label>
                                <input type="number" id="in-fuel" class="w-full rounded-xl p-3.5 text-sm font-mono" placeholder="20">
                            </div>
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5 block">목표/목적</label>
                            <input type="text" id="in-purpose" class="w-full rounded-xl p-3.5 text-sm">
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5 block">상세 계획</label>
                            <textarea id="in-detail" class="w-full rounded-xl p-3.5 text-sm h-24 resize-none"></textarea>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5 block">Tire Tag</label>
                                <select id="in-tire-type" class="w-full rounded-xl p-3.5 text-sm font-medium">
                                    <option value="new">신품 (New)</option>
                                    <option value="used">중고 (Used)</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5 block">Tire Detail</label>
                                <input type="text" id="in-tire" class="w-full rounded-xl p-3.5 text-sm" placeholder="예: 신품 2개, 중고 2개">
                            </div>
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5 block">기타</label>
                            <input type="text" id="in-note" class="w-full rounded-xl p-3.5 text-sm" placeholder="기타 사항 입력">
                        </div>
                    </div>
                </form>
                
                <!-- Modal Footer -->
                <div class="p-5 border-t border-slate-800 flex gap-3 shrink-0 bg-[#16181d] rounded-b-3xl">
                    <button onclick="deleteSessionFromModal()" id="btn-delete" class="px-5 py-3.5 bg-red-500/10 text-red-500 rounded-xl text-sm font-bold hover:bg-red-500/20 transition-all">Delete</button>
                    <button onclick="saveSession()" class="flex-1 py-3.5 bg-indigo-600 text-white rounded-xl text-sm font-bold shadow-lg shadow-indigo-500/20 hover:bg-indigo-500 transition-all">Save Config</button>
                </div>
            </div>
        </div>

        <!-- Settings Modal -->
        <div id="config-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">
            <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="this.parentElement.classList.add('hidden')"></div>
            <div class="bg-[#16181d] max-w-sm w-full rounded-3xl p-6 shadow-2xl z-10 border border-slate-700/50">
                <h3 class="font-bold text-white text-lg mb-5">Event Settings</h3>
                <div class="space-y-4">
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5">Car Identifier</label>
                        <input type="text" id="cfg-car" class="w-full rounded-xl p-3.5 text-sm">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5">Event Date</label>
                        <input type="text" id="cfg-date" class="w-full rounded-xl p-3.5 text-sm">
                    </div>
                </div>
                <button onclick="saveConfig()" class="w-full mt-6 bg-slate-100 text-slate-900 py-3.5 rounded-xl text-sm font-bold active:scale-95 transition-all">Apply</button>
            </div>
        </div>

    </div>
</body>
</html>
