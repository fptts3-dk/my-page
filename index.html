<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Race Engineer App - Realtime</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0b0c10; color: #e2e8f0; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        input, select, textarea { background-color: #1e2128 !important; color: #f1f5f9 !important; border: 1px solid #334155 !important; }
        input:focus, select:focus, textarea:focus { outline: none !important; border-color: #6366f1 !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center">
    <div class="w-full max-w-[480px] min-h-screen flex flex-col bg-[#0b0c10] shadow-2xl relative">
        <header class="sticky top-0 z-40 bg-[#0b0c10]/95 backdrop-blur-md px-4 pt-5 pb-3 flex items-center justify-center">
            <h1 class="text-base font-bold text-slate-100 tracking-wide">Session Plan (Realtime)</h1>
        </header>

        <main class="flex-1 px-4 pt-2 pb-10 overflow-x-hidden">
            <div id="timeline-container"></div>
            <div id="checklist-ui" class="mt-4"></div>
        </main>

        <div id="modal" class="fixed inset-0 z-50 hidden flex flex-col items-center justify-end sm:justify-center">
            <div class="absolute inset-0 bg-black/70 backdrop-blur-sm" onclick="closeModal()"></div>
            <div class="w-full max-w-[480px] bg-[#16181d] rounded-t-3xl sm:rounded-3xl z-10 flex flex-col max-h-[90vh] border border-slate-700/50 shadow-2xl">
                <div class="p-5 border-b border-slate-800 flex justify-between items-center">
                    <h3 class="font-bold text-white">Edit Session</h3>
                    <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center text-slate-400">✕</button>
                </div>
                <form id="session-form" class="p-5 space-y-4 overflow-y-auto" onsubmit="event.preventDefault()">
                    <input type="hidden" id="edit-id">
                    <div class="space-y-4">
                        <div><label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest block mb-1">Session Title</label><input type="text" id="in-name" class="w-full rounded-xl p-3 text-sm font-semibold"></div>
                        <div class="grid grid-cols-2 gap-4">
                            <div><label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest block mb-1">Time Slot</label><input type="text" id="in-time" class="w-full rounded-xl p-3 text-sm font-mono" placeholder="09:00-09:30"></div>
                            <div><label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest block mb-1">Fuel (L)</label><input type="number" id="in-fuel" class="w-full rounded-xl p-3 text-sm font-mono"></div>
                        </div>
                        <div><label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest block mb-1">목표/목적</label><input type="text" id="in-purpose" class="w-full rounded-xl p-3 text-sm"></div>
                        <div><label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest block mb-1">상세 계획</label><textarea id="in-detail" class="w-full rounded-xl p-3 text-sm h-24 resize-none"></textarea></div>
                        <div class="grid grid-cols-2 gap-4">
                            <div><label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest block mb-1">Tire Tag</label>
                                <select id="in-tire-type" class="w-full rounded-xl p-3 text-sm">
                                    <option value="new">신품 (New)</option><option value="used">중고 (Used)</option><option value="super">결승용 (Super)</option>
                                </select>
                            </div>
                            <div><label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest block mb-1">Tire Detail</label><input type="text" id="in-tire" class="w-full rounded-xl p-3 text-sm" placeholder="예: 신품 2개"></div>
                        </div>
                        <div><label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest block mb-1">기타</label><input type="text" id="in-note" class="w-full rounded-xl p-3 text-sm"></div>
                    </div>
                </form>
                <div class="p-5 border-t border-slate-800 flex gap-3 bg-[#16181d] rounded-b-3xl">
                    <button onclick="deleteSessionFromModal()" class="px-5 py-3.5 bg-red-500/10 text-red-500 rounded-xl text-sm font-bold hover:bg-red-500/20">Delete</button>
                    <button onclick="saveSession()" class="flex-1 py-3.5 bg-indigo-600 text-white rounded-xl text-sm font-bold shadow-lg hover:bg-indigo-500">Save Changes</button>
                </div>
            </div>
        </div>

        <div id="day-title-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">
            <div class="absolute inset-0 bg-black/70 backdrop-blur-sm" onclick="closeDayTitleModal()"></div>
            <div class="bg-[#16181d] max-w-sm w-full rounded-3xl p-6 shadow-2xl z-10 border border-slate-700/50">
                <input type="hidden" id="editing-day-id">
                <div class="flex justify-between items-center mb-5"><h3 class="font-bold text-white text-lg">일정 제목 수정</h3><button onclick="closeDayTitleModal()" class="text-slate-400">✕</button></div>
                <div><label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest block mb-1.5">제목 (Title)</label><input type="text" id="in-day-title" class="w-full rounded-xl p-3.5 text-sm"></div>
                <div class="flex gap-3 mt-6">
                    <button onclick="deleteDay()" class="px-5 bg-red-500/10 text-red-500 py-3.5 rounded-xl text-sm font-bold">Delete Day</button>
                    <button onclick="saveDayTitle()" class="flex-1 bg-slate-100 text-slate-900 py-3.5 rounded-xl text-sm font-bold">Apply</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // DK님이 제공해주신 Firebase 설정
        const firebaseConfig = {
            apiKey: "AIzaSyAGZxvxd-bBsv81xHek_PD4R7U14mw5chE",
            authDomain: "race-engineer-app-1cb35.firebaseapp.com",
            databaseURL: "https://race-engineer-app-1cb35-default-rtdb.firebaseio.com",
            projectId: "race-engineer-app-1cb35",
            storageBucket: "race-engineer-app-1cb35.firebasestorage.app",
            messagingSenderId: "748628237771",
            appId: "1:748628237771:web:815583050bf59ff0b8aa4e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const dataRef = ref(db, 'raceData');

        // 전역 상태
        window.appState = {
            car: "CAR #001 TEST",
            dayTitles: { 1: "Day 1 Schedule" },
            days: { 1: [] },
            checklist: []
        };
        let editingDay = 1;

        // --- 실시간 데이터 불러오기 ---
        onValue(dataRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                window.appState = data;
                renderAll();
            }
        });

        // --- 데이터 저장 함수 ---
        window.saveData = function() {
            set(dataRef, window.appState);
        };

        // --- UI 렌더링 로직 ---
        window.renderAll = () => {
            renderTimeline();
            renderChecklist();
        };

        function renderTimeline() {
            const list = document.getElementById('timeline-container');
            if (!list) return;
            list.innerHTML = '';
            const days = Object.keys(window.appState.days || {}).map(Number).sort((a,b) => a-b);
            
            days.forEach(day => {
                const sessions = window.appState.days[day] || [];
                const title = window.appState.dayTitles[day] || `Day ${day} Schedule`;
                let html = `<div class="mb-6 border border-slate-700/60 rounded-xl overflow-hidden bg-[#16181d] shadow-lg">
                    <div class="p-4 border-b border-slate-700/60 flex justify-between items-center bg-[#1c1e24]">
                        <h2 class="text-base font-bold text-slate-100">${title}</h2>
                        <button onclick="openDayTitleEditor(${day})" class="text-slate-400 hover:text-white p-1">⚙️</button>
                    </div><div class="flex flex-col">`;
                if (sessions.length === 0) html += `<div class="p-6 text-center text-xs text-slate-500 italic">No sessions.</div>`;
                
                sessions.forEach(s => {
                    const timeArr = (s.time || "").split(/[-~]/);
                    const start = timeArr[0] ? timeArr[0].trim() : "00:00";
                    const end = timeArr[1] ? timeArr[1].trim() : "";
                    const colors = { new: 'border-green-500', used: 'border-yellow-500', super: 'border-orange-500' };
                    const borderColor = colors[s.tireType] || 'border-blue-500';
                    html += `
                    <div class="flex flex-col border-b border-slate-800/60 last:border-none">
                        <div class="flex min-h-[4.5rem] group cursor-pointer hover:bg-white/[0.02]" onclick="toggleDetail('${s.id}')">
                            <div class="w-16 flex flex-col items-center justify-center shrink-0">
                                <span class="text-sm font-bold text-slate-200">${start}</span>
                                ${end ? `<span class="text-[10px] text-slate-500 mt-0.5">~ ${end}</span>` : ''}
                            </div>
                            <div class="flex-1 py-3 pr-4 flex items-center">
                                <div class="w-full bg-[#20232a] rounded-lg p-3 border-l-4 ${borderColor} flex justify-between items-center shadow-sm">
                                    <div class="min-w-0 pr-2">
                                        <h4 class="text-sm font-bold text-slate-100 truncate">${s.name}</h4>
                                        <p class="text-[11px] text-slate-400 truncate">${s.fuel}L • ${s.tire}</p>
                                    </div>
                                    <svg id="icon-${s.id}" class="transition-transform text-slate-600" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M6 9l6 6 6-6"/></svg>
                                </div>
                            </div>
                        </div>
                        <div id="detail-${s.id}" class="hidden flex pr-4 pb-4">
                            <div class="w-16 shrink-0"></div>
                            <div class="flex-1 bg-[#1c1e24] border border-slate-700/50 rounded-lg p-4 space-y-3 shadow-inner text-sm">
                                <div><p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">목표/목적</p><p class="text-slate-200">${s.purpose || '-'}</p></div>
                                <div><p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">상세 계획</p><p class="text-slate-300 whitespace-pre-wrap">${s.detail || '-'}</p></div>
                                ${s.note ? `<div><p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">기타</p><p class="text-slate-300">${s.note}</p></div>` : ''}
                                <div class="pt-3 border-t border-slate-700/50 flex justify-end">
                                    <button onclick="openEditor('${s.id}', ${day})" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-[11px] font-bold rounded-lg">수정하기</button>
                                </div>
                            </div>
                        </div>
                    </div>`;
                });
                html += `<div class="flex min-h-[3.2rem] group cursor-pointer hover:bg-white/[0.01]" onclick="addNewSession(${day})">
                    <div class="w-16 flex items-center justify-center shrink-0"><span class="text-slate-600 text-lg">+</span></div>
                    <div class="flex-1 py-2 pr-4 flex items-center"><div class="w-full bg-[#1c1e24] rounded-lg p-2 border border-dashed border-slate-700/50 flex justify-between items-center"><h4 class="text-xs font-bold text-slate-600">세션 추가</h4></div></div>
                </div></div></div>`;
                list.insertAdjacentHTML('beforeend', html);
            });
            list.insertAdjacentHTML('beforeend', `<button onclick="addDay()" class="w-full mb-6 py-4 border-2 border-dashed border-slate-700/60 rounded-xl text-slate-500 font-bold hover:text-slate-300">+ Add Day</button>`);
        }

        function renderChecklist() {
            const ui = document.getElementById('checklist-ui');
            if (!ui) return;
            const checklist = window.appState.checklist || [];
            const checked = checklist.filter(i => i.checked).length;
            const perc = checklist.length === 0 ? 0 : Math.round((checked/checklist.length)*100);
            
            let html = `<div class="mb-8 border border-slate-700/60 rounded-xl overflow-hidden bg-[#16181d] shadow-lg">
                <div class="p-4 border-b border-slate-700/60 bg-[#1c1e24]">
                    <div class="flex justify-between items-center mb-3"><h2 class="text-base font-bold text-slate-100">Checklist</h2><span class="text-xs font-bold text-indigo-400">${perc}%</span></div>
                    <div class="w-full bg-slate-800 rounded-full h-1.5 overflow-hidden"><div class="bg-indigo-500 h-1.5 transition-all duration-500" style="width: ${perc}%"></div></div>
                </div><div class="p-2 flex flex-col">`;
            checklist.forEach((item, i) => {
                html += `<div class="flex items-center justify-between py-1.5 px-3 border-b border-slate-800/60 last:border-none group">
                    <div class="flex items-center gap-3 cursor-pointer flex-1" onclick="toggleCheck(${i})">
                        <div class="w-5 h-5 rounded-md border-2 flex items-center justify-center ${item.checked ? 'bg-indigo-500 border-indigo-500' : 'border-slate-500 bg-slate-800/50'}">${item.checked ? '✓' : ''}</div>
                        <span class="text-sm ${item.checked ? 'text-slate-500 line-through' : 'text-slate-300'}">${item.text}</span>
                    </div><button onclick="deleteCheck(${i})" class="text-slate-600 hover:text-red-400 px-2">✕</button>
                </div>`;
            });
            html += `<div class="flex items-center gap-3 py-1.5 px-3"><span class="text-slate-500 text-lg">+</span><input type="text" placeholder="Add task..." onkeydown="if(event.key==='Enter') addCheck(this)" class="bg-transparent text-sm text-slate-300 focus:outline-none w-full border-none !important"></div></div></div>`;
            ui.innerHTML = html;
        }

        // --- 핸들러들을 전역(window)에 등록 (type="module" 대응) ---
        window.toggleDetail = (id) => {
            const el = document.getElementById(`detail-${id}`);
            const icon = document.getElementById(`icon-${id}`);
            if (el) el.classList.toggle('hidden');
            if (icon) icon.style.transform = el.classList.contains('hidden') ? 'rotate(0deg)' : 'rotate(180deg)';
        };
        window.toggleCheck = (i) => { window.appState.checklist[i].checked = !window.appState.checklist[i].checked; window.saveData(); };
        window.addCheck = (input) => { if (!input.value.trim()) return; if(!window.appState.checklist) window.appState.checklist = []; window.appState.checklist.push({ text: input.value, checked: false }); input.value = ''; window.saveData(); };
        window.deleteCheck = (i) => { window.appState.checklist.splice(i, 1); window.saveData(); };
        window.addDay = () => { const keys = Object.keys(window.appState.days || {}).map(Number); const next = keys.length > 0 ? Math.max(...keys) + 1 : 1; if(!window.appState.days) window.appState.days = {}; if(!window.appState.dayTitles) window.appState.dayTitles = {}; window.appState.days[next] = []; window.appState.dayTitles[next] = `Day ${next} Schedule`; window.saveData(); };
        window.deleteDay = () => { const d = document.getElementById('editing-day-id').value; delete window.appState.days[d]; delete window.appState.dayTitles[d]; closeDayTitleModal(); window.saveData(); };
        window.openDayTitleEditor = (d) => { document.getElementById('editing-day-id').value = d; document.getElementById('in-day-title').value = window.appState.dayTitles[d]; document.getElementById('day-title-modal').classList.remove('hidden'); };
        window.saveDayTitle = () => { const d = document.getElementById('editing-day-id').value; window.appState.dayTitles[d] = document.getElementById('in-day-title').value; closeDayTitleModal(); window.saveData(); };
        window.closeDayTitleModal = () => document.getElementById('day-title-modal').classList.add('hidden');
        window.closeModal = () => document.getElementById('modal').classList.add('hidden');
        window.addNewSession = (day) => { editingDay = day; document.getElementById('session-form').reset(); document.getElementById('edit-id').value = ""; document.getElementById('modal').classList.remove('hidden'); };
        window.openEditor = (id, day) => { editingDay = day; const s = window.appState.days[day].find(x => x.id === id); if (!s) return; document.getElementById('edit-id').value = id; document.getElementById('in-name').value = s.name; document.getElementById('in-time').value = s.time; document.getElementById('in-fuel').value = s.fuel; document.getElementById('in-purpose').value = s.purpose; document.getElementById('in-detail').value = s.detail; document.getElementById('in-tire-type').value = s.tireType; document.getElementById('in-tire').value = s.tire; document.getElementById('in-note').value = s.note || ""; document.getElementById('modal').classList.remove('hidden'); };
        window.saveSession = () => {
            const id = document.getElementById('edit-id').value;
            const data = { id: id || Date.now().toString(), name: document.getElementById('in-name').value || "New Session", time: document.getElementById('in-time').value || "00:00 - 00:00", fuel: parseInt(document.getElementById('in-fuel').value) || 0, purpose: document.getElementById('in-purpose').value, detail: document.getElementById('in-detail').value, tireType: document.getElementById('in-tire-type').value, tire: document.getElementById('in-tire').value, note: document.getElementById('in-note').value };
            if (id) { const idx = window.appState.days[editingDay].findIndex(x => x.id === id); if (idx !== -1) window.appState.days[editingDay][idx] = data; } 
            else { window.appState.days[editingDay].push(data); }
            closeModal(); window.saveData();
        };
        window.deleteSessionFromModal = () => { const id = document.getElementById('edit-id').value; window.appState.days[editingDay] = window.appState.days[editingDay].filter(x => x.id !== id); closeModal(); window.saveData(); };
    </script>
</body>
</html>
